# =====================================================================
#  mbtn - example configuration
# =====================================================================
#  Comments: only WHOLE lines starting with '#'.
#  Comments on the same line as a command are NOT supported
#  (they would become part of the command).
#
#  Format:   [!][MODIFIERS+]TRIGGER = command
#  The command may be wrapped in double quotes, but does not have to be.
#  Lines are split at the first '=', so '=' inside a command is allowed.
#  Names are case-insensitive.
#  Commands are run in the background via 'sh -c', so a trailing '&'
#  is not needed.
#
#  The config is reloaded automatically when the file changes. An invalid
#  config is rejected with an error message and the previous one stays
#  active. Changing device_name, or turning blocking on or off, reopens
#  the device.
# =====================================================================

# ---------------------------------------------------------------------
#  GENERAL SETTINGS
# ---------------------------------------------------------------------
# Exact device name. Check it with:  ./mbtn --list
# (the field after "device_name = ").
device_name = YOUR_MOUSE_NAME

# Minimum interval (ms) between horizontal wheel actions
# (optional, default 0).
wheel_delay = 150

# Minimum interval (ms) between vertical wheel actions
# (optional, default 0).
scroll_delay = 0

# ---------------------------------------------------------------------
#  BUTTONS (usable as modifiers and in *_CLICK / *_TAP triggers)
# ---------------------------------------------------------------------
#  LEFT  RIGHT  MIDDLE  SIDE  EXTRA  FORWARD  BACK  TASK
#  0 1 2 ... 9           (BTN_0..BTN_9, found on gaming mice)
#  CODE_<code>           any code in 0x100..0x13f, e.g. CODE_0x118
#  The BTN_ prefix is optional (BTN_SIDE = SIDE).
#
#  Note: mice map their side buttons differently. Some use SIDE/EXTRA,
#  others FORWARD/BACK. Check ./mbtn --list, or press the buttons with
#  ./mbtn --monitor.
#
# ---------------------------------------------------------------------
#  TRIGGERS (exactly one per binding)
# ---------------------------------------------------------------------
#  WHEEL_UP, WHEEL_DOWN      vertical wheel
#  WHEEL_LEFT, WHEEL_RIGHT   horizontal wheel (tilt)
#  <BUTTON>_CLICK            fires when the button is pressed
#  <BUTTON>_TAP              fires on release, but only if the button
#                            was not used in a combination (wheel or
#                            another button)
#
#  LEFT_CLICK, RIGHT_CLICK and MIDDLE_CLICK are not special cases: they
#  are the general <BUTTON>_CLICK pattern.
#
# ---------------------------------------------------------------------
#  MODIFIERS
# ---------------------------------------------------------------------
#  Any number of buttons joined with '+', no repeats:
#      SIDE+WHEEL_UP
#      SIDE+EXTRA+WHEEL_UP
#      RIGHT+SIDE+MIDDLE_CLICK
#
#  Matching is EXACT: a binding without modifiers fires only when none
#  of the tracked buttons is held. Tracked buttons are the ones used as
#  modifiers or in *_TAP triggers anywhere in the config, plus all
#  buttons listed in 'swallow'. Other buttons are ignored.
#
# ---------------------------------------------------------------------
#  TAP vs. combinations
# ---------------------------------------------------------------------
#  SIDE_TAP fires only after SIDE is released, and only if you did not
#  use the wheel or another button while holding it. This lets the same
#  button be both a modifier (SIDE+WHEEL_UP) and a standalone button
#  (SIDE_TAP).
#  Mouse movement does not count as a combination.
#  Using CLICK on a button that is also a modifier fires the action on
#  every press, including at the start of a combination, so use TAP
#  for such buttons.
#
# ---------------------------------------------------------------------
#  BLOCKING (events are NOT blocked by default)
# ---------------------------------------------------------------------
#  Without any of the options below, applications still receive every
#  original event: RIGHT_CLICK opens the context menu, SIDE acts as
#  "back" in a browser, the wheel keeps scrolling.
#
#  Blocking grabs the mouse and forwards the events that are not blocked
#  through a virtual device named "mbtn virtual: <device name>". It needs
#  write access to /dev/uinput (one-time setup: sudo ./mbtn --grant-uinput).
#  If mbtn stops, the grab ends and the mouse works normally again.
#
#  Level 1: '!' before a binding blocks its trigger event.
#      !SIDE+WHEEL_UP = command    wheel events (also hi-res) are not
#                                  forwarded, so the page does not scroll
#      !RIGHT+LEFT_CLICK = command the press is blocked and so is its release
#      !SIDE+WHEEL_UP =            the command may be empty: block only
#      A modifier is still forwarded unless it is swallowed (level 2).
#
#  Level 2: 'swallow' lists buttons whose press is held back.
#      swallow = SIDE, EXTRA
#      - used in a combination (wheel or another button): the client
#        receives nothing, so no "back" after SIDE+WHEEL_UP;
#      - released without a combination: the click is sent to the client
#        on release, unless a '!' on its *_TAP binding blocks it.
#      Cost: the click is delayed until release and dragging with that
#      button does not work.
#
#  '!' on a *_TAP trigger is accepted only for swallowed buttons.
#
#  The commands below (wpctl, playerctl, brightnessctl, foot) are only
#  examples; adapt them to your system.
# =====================================================================

# Level 2: SIDE and EXTRA are used as modifiers, so do not leak their
# clicks to the client after a combination.
swallow = SIDE, EXTRA

# ---------------------------------------------------------------------
#  Examples: vertical wheel with a modifier (volume, brightness)
#  '!' keeps the application under the cursor from scrolling.
# ---------------------------------------------------------------------
!SIDE+WHEEL_UP    = wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
!SIDE+WHEEL_DOWN  = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

!EXTRA+WHEEL_UP   = brightnessctl set 5%+
!EXTRA+WHEEL_DOWN = brightnessctl set 5%-

# ---------------------------------------------------------------------
#  Examples: horizontal wheel (previous / next track), not blocked
# ---------------------------------------------------------------------
WHEEL_LEFT       = playerctl previous
WHEEL_RIGHT      = playerctl next

# ---------------------------------------------------------------------
#  Examples: two-modifier combinations (fine volume control)
# ---------------------------------------------------------------------
!SIDE+EXTRA+WHEEL_UP   = wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 1%+
!SIDE+EXTRA+WHEEL_DOWN = wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-

# ---------------------------------------------------------------------
#  Examples: clicks with a modifier
#  The middle click is blocked so that nothing is pasted.
# ---------------------------------------------------------------------
!SIDE+MIDDLE_CLICK = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
!EXTRA+MIDDLE_CLICK = playerctl play-pause
!SIDE+RIGHT_CLICK   = foot

# ---------------------------------------------------------------------
#  Examples: TAP of a swallowed button
#  SIDE_TAP runs the command AND the click still reaches the client
#  (e.g. "back" in a browser).
#  !EXTRA_TAP runs the command only; the click is not forwarded.
# ---------------------------------------------------------------------
SIDE_TAP   = notify-send "SIDE tapped"
!EXTRA_TAP = playerctl next

# ---------------------------------------------------------------------
#  Examples: FORWARD / BACK / TASK (if your mouse has them)
#  They are not swallowed, so their clicks always reach the client.
# ---------------------------------------------------------------------
FORWARD+WHEEL_UP   = playerctl volume 0.05+
FORWARD+WHEEL_DOWN = playerctl volume 0.05-
TASK_CLICK         = foot

# ---------------------------------------------------------------------
#  Examples: numeric button code (if --list shows CODE_...)
# ---------------------------------------------------------------------
# CODE_0x118+WHEEL_UP = brightnessctl set 5%+
# BTN_0_CLICK         = foot

# ---------------------------------------------------------------------
#  Example: quoted command with more complex syntax
# ---------------------------------------------------------------------
# RIGHT+WHEEL_UP = "sh -c 'notify-send \"Test\" \"RIGHT+WHEEL_UP\"'"
